[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "document-rag"
version = "0.1.0"
description = "Локальный RAG по PDF с проверяемыми цитатами"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "celery[redis]>=5.6,<5.7", "redis>=5.2,<7",
  "qdrant-client>=1.17,<1.18", "pypdf>=6,<7",
  "langchain-core>=1.2,<2", "langchain-text-splitters>=1,<2",
  "langchain-huggingface>=1,<2", "langchain-qdrant>=1.1,<2",
  "langchain-ollama>=1,<2", "fastembed>=0.8,<1",
  "langsmith>=0.4,<1", "ollama>=0.6,<1", "huggingface-hub>=0.33.4,<1",
  "sentence-transformers>=5,<6", "transformers>=4.51,<5", "torch>=2.6,<3",
  "httpx>=0.28,<1", "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "fakeredis[lua]>=2.28,<3"]

[project.scripts]
rag = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: проверка с настоящими Qdrant и Redis",
  "models: проверка с загруженными локальными моделями",
]
