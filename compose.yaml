x-build: &build
  context: .
  args:
    TORCH_REQUIREMENT: torch==2.14.1
    TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126

x-accelerator: &accelerator
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

x-app: &app
  image: document-rag:cuda
  build: *build
  env_file:
    - path: .env
      required: false
  environment: &environment
    RAG_QDRANT_URL: http://qdrant:6333
    RAG_BROKER_URL: redis://redis:6379/0
    RAG_RESULT_BACKEND_URL: redis://redis:6379/1
    RAG_STATE_REDIS_URL: redis://redis:6379/2
    RAG_OLLAMA_URL: ${RAG_CONTAINER_OLLAMA_URL:-http://ollama:11434}
    RAG_STORAGE_DIR: /data/documents
    RAG_MODEL_CACHE_DIR: /data/models
  volumes:
    - documents:/data/documents
    - models:/data/models
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started
  profiles: [app]
  mem_limit: 4g
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: ["/tmp:size=512m,mode=1777"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]

  ollama:
    image: ollama/ollama:0.17.7
    profiles: [inference]
    deploy: *accelerator
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${RAG_LLM_KEEP_ALIVE:-5m}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: f16
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  api:
    <<: *app
    deploy: *accelerator
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    deploy: *accelerator
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=INFO]

  scheduler:
    <<: *app
    mem_limit: 512m
    command: [celery, -A, app.workers.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/data/documents/celerybeat-schedule]

volumes:
  documents:
  models:
  redis:
  qdrant:
  ollama:
